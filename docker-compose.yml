version: "3.8"

services:
  # Core MCP SSH server: mingyang91/ssh-mcp, only reachable inside Docker network
  sshmcp-core:
    image: mingyang91/ssh-mcp:latest
    container_name: sshmcp-core
    restart: unless-stopped

    networks:
      - highfishNetwork

    # Internal MCP port only
    expose:
      - "8000"

    # Optional host data mount (adjust to your environment)
    volumes:
      - /home/sshmcp:/data

    environment:
      RUST_LOG: "info"
      MCP_PORT: "8000"

  # Auth layer: Node.js API-key auth proxy from GHCR, exposing port 8822
  sshmcp-auth:
    image: ghcr.io/jbkunama1/hai.sshmcpauth:latest
    container_name: sshmcp-auth
    restart: unless-stopped

    networks:
      - highfishNetwork

    ports:
      - "8822:8822"   # external:internal
      - "8825:8825"   # admin UI / CLI (alias registry)

    # Alias registry (plaintext SSH credentials) - bind-mount from the host.
    # Writable so the admin UI can save new aliases.
    # Keep real credentials out of git; create data/ssh_aliases.json from the sample.
    volumes:
      - ./data:/data

    environment:
      # Values are interpolated from the shell environment or a .env file
      # next to this compose file. The :-fallbacks keep the previous
      # CHANGE_ME placeholders so a missing config stays obvious.
      SSHMCP_API_KEY: "${SSHMCP_API_KEY:-CHANGE_ME_WITH_A_LONG_RANDOM_API_KEY}"

      # Target MCP server inside the network.
      # TARGET_PATH is the upstream endpoint path. mingyang91/ssh-mcp serves
      # streamable HTTP at "/", so clients still call /mcp on the proxy.
      SSHMCP_TARGET_HOST: "${SSHMCP_TARGET_HOST:-sshmcp-core}"
      SSHMCP_TARGET_PORT: "${SSHMCP_TARGET_PORT:-8000}"
      SSHMCP_TARGET_PATH: "${SSHMCP_TARGET_PATH:-/}"

      # Port on which the auth proxy listens inside the container
      SSHMCP_LISTEN_PORT: "${SSHMCP_LISTEN_PORT:-8822}"

      # Alias registry file with SSH credentials (plaintext for now)
      SSHMCP_ALIASES_FILE: "${SSHMCP_ALIASES_FILE:-/data/ssh_aliases.json}"

      # Admin port + password for the alias-management UI / CLI
      SSHMCP_ADMIN_PORT: "${SSHMCP_ADMIN_PORT:-8825}"
      SSHMCP_ADMIN_PASSWORD: "${SSHMCP_ADMIN_PASSWORD:-CHANGE_ME_ADMIN}"

networks:
  highfishNetwork:
    external: true
