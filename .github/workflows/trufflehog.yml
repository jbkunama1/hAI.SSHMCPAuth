name: 🔐 TruffleHog Secret Scan

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

jobs:
  trufflehog:
    name: TruffleHog Scanning
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      actions: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --results=verified,unknown

      - name: Scan-Zusammenfassung ausgeben
        if: always()
        run: |
          echo "TruffleHog Scan abgeschlossen."
          echo "Ergebnis: ${{ job.status }}"
